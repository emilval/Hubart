<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 相机主体 -->
  <rect x="30" y="60" width="140" height="90" rx="10" ry="10" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 顶部闪光灯/取景器 -->
  <rect x="70" y="45" width="60" height="20" rx="4" ry="4" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 镜头外圈 -->
  <circle cx="100" cy="105" r="38" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 镜头内圈 -->
  <circle cx="100" cy="105" r="26" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 镜头中心 -->
  <circle cx="100" cy="105" r="12" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 高光点 -->
  <circle cx="112" cy="93" r="4" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 按钮 -->
  <circle cx="150" cy="75" r="6" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>